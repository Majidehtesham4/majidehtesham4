# Which site (business environment) a request is for.
#   <name>.localhost:8080  ->  the site «<name>.localhost» (one per business, made by business.ps1)
#   <name>.<your domain>   ->  the site «<name>.<your domain>», e.g. shop.example.ir: a business
#                              reached from the internet (business.ps1 new shop.example.ir)
#   anything else (localhost, this computer's IP, your bare domain or www.)  ->  the main site
# Browsers send every <name>.localhost to this computer, so nothing has to be added to hosts files.
map $host $frappe_site {
	default frontend;
	~^[a-z0-9-]+\.localhost$ $host;
	~^www\. frontend;
	"~^[a-z0-9-]+\.[a-z0-9-]+\.[a-z]{2,}$" $host;
}
