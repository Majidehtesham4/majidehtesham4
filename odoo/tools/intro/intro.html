<!doctype html>
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="wordmark_mask.js"></script>
<script src="net_graph.js"></script>
<script>
// VERON ERP intros. The logo is rebuilt as lines (in the 1032 x 1048 space of the traced logo, its tile centred on
// 511, 526) so that every line can be drawn, lit and swept by light on its own. render(t, scene) draws one frame.
const W = 1920, H = 1080;
const c = document.getElementById("c");
const ctx = c.getContext("2d");

const RED = [235, 22, 34];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const mix = (a, b, x) => a + (b - a) * x;
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
const rad = (d) => (d * Math.PI) / 180;

// --- the logo's geometry
const CX = 512, CY = 532;              // centre of the rings
const TOPY = 288, SLOPE = 0.5, VW = 24; // the V: its top, its slope (dx/dy), its line width
const APEX = [610, 725, 855];           // the three nested V's, inner to outer
const ARCS = [                          // the signal arcs above, top to bottom: top y, half chord, sagitta, width
	[207, 162, 30, 22], [250, 140, 26, 16], [292, 120, 24, 16], [335, 100, 22, 15], [377, 78, 20, 14], [412, 57, 16, 12],
].map(([y, h, s, w]) => {
	const R = (h * h + s * s) / (2 * s);
	const phi = Math.asin(h / R);
	return { cy: y + R, R, a0: -Math.PI / 2 - phi, a1: -Math.PI / 2 + phi, w, len: 2 * phi * R };
});
const RINGS = [ // radius, width, upper angle, lower angle (left side, degrees, clockwise from +x)
	[330, 26, 221, 100], [281, 20, 233, 104], [235, 18, 233, 108], [199, 13, 240, 150], [160, 11, 235, 165],
].map(([r, w, up, low]) => ({ r, w, up: rad(up), low: rad(low) }));

function vArm(i, side) {
	// from the top (a little above, cut flat by the clip) to the apex
	const ay = APEX[i], top = TOPY - 20;
	const half = (ay - top) * SLOPE;
	return { x0: CX + side * half, y0: top, x1: CX, y1: ay, len: Math.hypot(half, ay - top) };
}

// The V's outer triangle, widened by the gap the rings keep from it
function outsideV(cx) {
	const d = 30, apex = APEX[2] + d / Math.sin(Math.atan(SLOPE)), sh = d / Math.cos(Math.atan(SLOPE));
	const topY = -200, half = (apex - topY) * SLOPE;
	cx.beginPath();
	cx.rect(-500, -500, 2100, 2100);
	cx.moveTo(CX - half - sh * 0, topY);
	cx.lineTo(CX, apex);
	cx.lineTo(CX + half, topY);
	cx.closePath();
	cx.clip("evenodd");
}

// --- light: a neon line in three passes, «lit» from 0 (dark metal) to 1 (full red light)
function neon(path, w, lit, s, opts = {}) {
	const dark = opts.dark ?? 1;
	ctx.save();
	ctx.lineCap = opts.cap || "butt";
	ctx.lineJoin = "miter";
	ctx.miterLimit = 10;
	// the unlit metal line: deep red-brown with a faint edge
	if (dark > 0 && lit < 1) {
		ctx.strokeStyle = `rgba(52,14,17,${dark * (1 - lit * 0.7)})`;
		ctx.lineWidth = w;
		path(); ctx.stroke();
		ctx.strokeStyle = `rgba(120,40,44,${0.35 * dark * (1 - lit)})`;
		ctx.lineWidth = w * 0.18;
		path(); ctx.stroke();
	}
	if (lit > 0) {
		ctx.globalCompositeOperation = "lighter";
		ctx.shadowColor = rgba(RED, 0.95 * lit);
		ctx.shadowBlur = 40 * s;
		ctx.strokeStyle = rgba([190, 8, 18], 0.22 * lit);
		ctx.lineWidth = w * 1.35;
		path(); ctx.stroke();
		ctx.shadowBlur = 12 * s;
		ctx.strokeStyle = rgba([222, 18, 28], 0.95 * lit);
		ctx.lineWidth = w * 0.92;
		path(); ctx.stroke();
		ctx.shadowBlur = 0;
		ctx.strokeStyle = rgba([255, 92, 84], 0.5 * lit * (opts.core ?? 1));
		ctx.lineWidth = Math.max(1.5, w * 0.22);
		path(); ctx.stroke();
	}
	ctx.restore();
}

// a glowing head where a line is being drawn
function head(x, y, size, a) {
	if (a <= 0) return;
	ctx.save();
	ctx.globalCompositeOperation = "lighter";
	const g = ctx.createRadialGradient(x, y, 0, x, y, size);
	g.addColorStop(0, `rgba(255,235,230,${a})`);
	g.addColorStop(0.25, `rgba(255,70,70,${0.8 * a})`);
	g.addColorStop(1, "rgba(255,0,0,0)");
	ctx.fillStyle = g;
	ctx.fillRect(x - size, y - size, size * 2, size * 2);
	ctx.restore();
}

// --- the parts of the logo, each with its own amount drawn (0..1) and lit (0..1)
function drawArc(i, drawn, lit, s, fromMiddle = true) {
	const a = ARCS[i];
	if (drawn <= 0) return;
	const mid = -Math.PI / 2, span = (a.a1 - a.a0) / 2 * drawn;
	const a0 = fromMiddle ? mid - span : a.a0, a1 = fromMiddle ? mid + span : a.a0 + (a.a1 - a.a0) * drawn;
	neon(() => { ctx.beginPath(); ctx.arc(CX, a.cy, a.R, a0, a1); }, a.w, lit, s);
	if (drawn < 1) {
		head(CX + a.R * Math.cos(a0), a.cy + a.R * Math.sin(a0), 26, lit);
		head(CX + a.R * Math.cos(a1), a.cy + a.R * Math.sin(a1), 26, lit);
	}
}

function drawV(i, drawn, lit, s) {
	if (drawn <= 0) return;
	ctx.save();
	ctx.beginPath();
	ctx.rect(-500, TOPY, 2100, 2100);
	ctx.clip();
	const L = vArm(i, -1), R = vArm(i, 1);
	if (drawn >= 1) {
		neon(() => { ctx.beginPath(); ctx.moveTo(L.x0, L.y0); ctx.lineTo(CX, L.y1); ctx.lineTo(R.x0, R.y0); }, VW, lit, s);
	} else {
		const e = drawn;
		for (const A of [L, R]) {
			const x = mix(A.x0, A.x1, e), y = mix(A.y0, A.y1, e);
			neon(() => { ctx.beginPath(); ctx.moveTo(A.x0, A.y0); ctx.lineTo(x, y); }, VW, lit, s);
			head(x, y, 34, lit);
		}
	}
	ctx.restore();
}

function drawRing(i, drawn, lit, s) {
	if (drawn <= 0) return;
	const r = RINGS[i];
	ctx.save();
	outsideV(ctx);
	const left = r.up - (r.up - r.low) * drawn;          // the left side runs down, anticlockwise
	const rightStart = Math.PI - r.up + 2 * Math.PI, rightEnd = rightStart + (r.up - r.low) * drawn;
	neon(() => {
		ctx.beginPath(); ctx.arc(CX, CY, r.r, r.up, left, true);
		ctx.moveTo(CX + r.r * Math.cos(rightStart), CY + r.r * Math.sin(rightStart));
		ctx.arc(CX, CY, r.r, rightStart, rightEnd, false);
	}, r.w, lit, s);
	if (drawn < 1) {
		head(CX + r.r * Math.cos(left), CY + r.r * Math.sin(left), 30, lit);
		head(CX + r.r * Math.cos(rightEnd), CY + r.r * Math.sin(rightEnd), 30, lit);
	}
	ctx.restore();
}

function tilePath(cx = ctx) {
	cx.beginPath();
	cx.roundRect(54, 68, 914, 916, 132);
}

function drawTile(a, s, edge = 0.08) {
	if (a <= 0) return;
	ctx.save();
	ctx.globalAlpha = a;
	ctx.shadowColor = "rgba(0,0,0,0.85)";
	ctx.shadowBlur = 80 * s;
	ctx.shadowOffsetY = 30 * s;
	const g = ctx.createLinearGradient(0, 68, 0, 984);
	g.addColorStop(0, "#252830");
	g.addColorStop(0.5, "#1a1c22");
	g.addColorStop(1, "#111216");
	ctx.fillStyle = g;
	tilePath(); ctx.fill();
	ctx.shadowColor = "transparent";
	// the bevel of the edge: light above, dark below
	const e = ctx.createLinearGradient(0, 68, 0, 984);
	e.addColorStop(0, `rgba(255,255,255,${edge * 2.2})`);
	e.addColorStop(0.5, `rgba(255,255,255,${edge * 0.5})`);
	e.addColorStop(1, `rgba(0,0,0,0.5)`);
	ctx.strokeStyle = e;
	ctx.lineWidth = 5;
	tilePath(); ctx.stroke();
	// a soft sheen on the upper left
	const sh = ctx.createRadialGradient(260, 200, 0, 260, 200, 700);
	sh.addColorStop(0, "rgba(255,255,255,0.05)");
	sh.addColorStop(1, "rgba(255,255,255,0)");
	ctx.fillStyle = sh;
	tilePath(); ctx.fill();
	ctx.restore();
}

// the logo, placed on the screen: centre x, y and its scale (the tile is 914 units wide)
function withLogo(x, y, s, fn) {
	ctx.save();
	ctx.translate(x, y);
	ctx.scale(s, s);
	ctx.translate(-511, -526);
	fn();
	ctx.restore();
}

// --- the wordmark VERON ERP (traced from the designed one: VERON heavy, ERP light, a red line under ERP), drawn as
// brushed metal; its red light is a thin line around the outside of every letter, and a brighter spot of it can run
// all the way round the word
const MASK_W = 1755, MASK_H = 290, UNDER = [1298, 258, 1740, 258];
const maskImg = new Image();
maskImg.src = window.WORDMARK_MASK;
const maskReady = new Promise((r) => (maskImg.onload = r));
const wordCache = {};

function wordLayers(w) {
	if (wordCache[w]) return wordCache[w];
	const k = w / MASK_W, h = Math.round(MASK_H * k), pad = 60;
	const make = () => { const cv = document.createElement("canvas"); cv.width = w + pad * 2; cv.height = h + pad * 2; return cv; };
	const mask = make(), contour = make(), face = make(), edge = make();
	const mc = mask.getContext("2d");
	mc.drawImage(maskImg, pad, pad, w, h);
	// the outline: the letters grown by a little, less the letters themselves
	const cc = contour.getContext("2d");
	const r = Math.max(1.6, w / 520);
	for (let i = 0; i < 16; i++) {
		const a = (i / 16) * Math.PI * 2;
		cc.drawImage(mask, Math.cos(a) * r, Math.sin(a) * r);
	}
	cc.globalCompositeOperation = "destination-out";
	cc.drawImage(mask, 0, 0);
	return (wordCache[w] = { k, h, pad, mask, contour, face, edge });
}

function drawWord(x, y, w, p) {
	// p: alpha, blur, metal (0 dark .. 1 bright), sweep (-0.5..1.5) and sweepStrength, rim (0..1, the red outline),
	// orbit (an angle: where the bright spot of the outline is) and orbitStrength, under (0..1 drawn) and underLit
	if ((p.alpha ?? 1) <= 0) return;
	const L = wordLayers(w), { k, h, pad } = L;
	const fw = L.face.width, fh = L.face.height;
	const fx = L.face.getContext("2d");
	fx.globalCompositeOperation = "source-over";
	fx.clearRect(0, 0, fw, fh);
	fx.drawImage(L.mask, 0, 0);
	fx.globalCompositeOperation = "source-in";
	const m = p.metal ?? 1;
	const g = fx.createLinearGradient(0, pad, 0, pad + h);
	const c = (lo, hi) => Math.round(mix(lo, hi, m));
	g.addColorStop(0, `rgb(${c(46, 214)},${c(48, 218)},${c(53, 226)})`);
	g.addColorStop(0.42, `rgb(${c(32, 150)},${c(34, 155)},${c(38, 164)})`);
	g.addColorStop(0.5, `rgb(${c(24, 92)},${c(25, 96)},${c(29, 104)})`);
	g.addColorStop(1, `rgb(${c(34, 168)},${c(36, 172)},${c(40, 182)})`);
	fx.fillStyle = g;
	fx.fillRect(0, 0, fw, fh);
	if (p.sweep !== undefined && p.sweep > -0.5 && p.sweep < 1.5) {
		fx.globalCompositeOperation = "source-atop";
		const sx = mix(-260, fw + 260, p.sweep);
		const band = fx.createLinearGradient(sx - 150, 0, sx + 150, 0);
		const col = p.sweepColor || [255, 255, 255];
		band.addColorStop(0, rgba(col, 0));
		band.addColorStop(0.5, rgba(col, 0.85 * (p.sweepStrength ?? 1)));
		band.addColorStop(1, rgba(col, 0));
		fx.save();
		fx.setTransform(1, 0, -0.4, 1, 0.4 * fh / 2, 0);
		fx.fillStyle = band;
		fx.fillRect(-fw, 0, fw * 3, fh);
		fx.restore();
	}
	const ox = x - fw / 2, oy = y - fh / 2;
	ctx.save();
	ctx.globalAlpha = p.alpha ?? 1;
	if (p.blur) ctx.filter = `blur(${p.blur}px)`;
	ctx.shadowColor = "rgba(0,0,0,0.9)";
	ctx.shadowBlur = 22;
	ctx.shadowOffsetY = 9;
	ctx.drawImage(L.face, ox, oy);
	ctx.shadowColor = "transparent";
	// the red outline, brighter where the orbiting spot is
	const rim = p.rim ?? 0, orbit = p.orbitStrength ?? 0;
	if (rim > 0 || orbit > 0) {
		const ex = L.edge.getContext("2d");
		ex.globalCompositeOperation = "source-over";
		ex.clearRect(0, 0, fw, fh);
		ex.drawImage(L.contour, 0, 0);
		ex.globalCompositeOperation = "source-in";
		if (orbit > 0 && p.orbit !== undefined) {
			const cg = ex.createConicGradient(p.orbit, fw / 2, fh / 2);
			const base = rgba([255, 36, 46], rim);
			cg.addColorStop(0, rgba([255, 225, 215], Math.min(1, rim + orbit)));
			cg.addColorStop(0.035, rgba([255, 70, 70], Math.min(1, rim + orbit * 0.8)));
			cg.addColorStop(0.11, base);
			cg.addColorStop(0.89, base);
			cg.addColorStop(0.965, rgba([255, 70, 70], Math.min(1, rim + orbit * 0.8)));
			cg.addColorStop(1, rgba([255, 225, 215], Math.min(1, rim + orbit)));
			ex.fillStyle = cg;
		} else {
			ex.fillStyle = rgba([255, 36, 46], rim);
		}
		ex.fillRect(0, 0, fw, fh);
		ctx.globalCompositeOperation = "lighter";
		ctx.shadowColor = rgba(RED, 0.9);
		ctx.shadowBlur = 16;
		ctx.drawImage(L.edge, ox, oy);
		ctx.shadowBlur = 5;
		ctx.drawImage(L.edge, ox, oy);
		ctx.globalCompositeOperation = "source-over";
		ctx.shadowColor = "transparent";
	}
	ctx.restore();
	// the red line under ERP: drawn from the left, a neon line
	const under = p.under ?? 1;
	if (under > 0) {
		const x0 = ox + pad + UNDER[0] * k, x1 = ox + pad + UNDER[2] * k, uy = oy + pad + UNDER[1] * k;
		const xe = mix(x0, x1, under);
		ctx.save();
		ctx.globalAlpha = p.alpha ?? 1;
		neon(() => { ctx.beginPath(); ctx.moveTo(x0, uy); ctx.lineTo(xe, uy); }, Math.max(3, 9 * k * 1.3), p.underLit ?? 1, 1, { cap: "round", dark: 0.9 });
		if (under < 1) head(xe, uy, 22, p.underLit ?? 1);
		ctx.restore();
	}
}

// --- the background
const grain = document.createElement("canvas");
grain.width = 512; grain.height = 512;
(() => {
	const g = grain.getContext("2d"), d = g.createImageData(512, 512);
	let seed = 7;
	const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
	for (let i = 0; i < d.data.length; i += 4) {
		const v = rnd() * 255;
		d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
		d.data[i + 3] = 255;
	}
	g.putImageData(d, 0, 0);
})();

function background(base, glow, glowY, t, glowX = W / 2) {
	ctx.fillStyle = base;
	ctx.fillRect(0, 0, W, H);
	if (glow > 0) {
		const g = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, 760);
		g.addColorStop(0, rgba([120, 8, 14], 0.55 * glow));
		g.addColorStop(0.5, rgba([60, 4, 8], 0.25 * glow));
		g.addColorStop(1, "rgba(0,0,0,0)");
		ctx.fillStyle = g;
		ctx.fillRect(0, 0, W, H);
	}
}

function vignette(a) {
	const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0);
	g.addColorStop(0, "rgba(0,0,0,0)");
	g.addColorStop(1, `rgba(0,0,0,${a})`);
	ctx.fillStyle = g;
	ctx.fillRect(0, 0, W, H);
}

function filmGrain(t, a) {
	// a little light noise added everywhere: it breaks the steps of the dark gradients (no rings after compression)
	ctx.save();
	ctx.globalAlpha = 0.03;
	ctx.globalCompositeOperation = "lighter";
	const dx = Math.floor((t * 431) % 512), dy = Math.floor((t * 277) % 512);
	ctx.fillStyle = ctx.createPattern(grain, "repeat");
	ctx.translate(-dx, -dy);
	ctx.fillRect(dx, dy, W, H);
	ctx.restore();
	ctx.save();
	ctx.globalAlpha = a;
	ctx.globalCompositeOperation = "overlay";
	const ox = Math.floor((t * 997) % 512), oy = Math.floor((t * 613) % 512);
	ctx.fillStyle = ctx.createPattern(grain, "repeat");
	ctx.translate(-ox, -oy);
	ctx.fillRect(ox, oy, W, H);
	ctx.restore();
}

function fade(a) {
	if (a <= 0) return;
	ctx.fillStyle = `rgba(0,0,0,${a})`;
	ctx.fillRect(0, 0, W, H);
}

// deterministic sparks
const SPARKS = Array.from({ length: 70 }, (_, i) => {
	const r1 = Math.sin(i * 12.9898) * 43758.5453, r2 = Math.sin(i * 78.233) * 12345.678, r3 = Math.sin(i * 39.425) * 9876.54;
	const f = (v) => v - Math.floor(v);
	return { a: f(r1) * Math.PI * 2, v: 260 + f(r2) * 620, size: 1.2 + f(r3) * 2.6, life: 0.7 + f(r2 * 1.7) * 1.1 };
});

// =============== scene 1: Signal ===============
const WORD_W = 860;
const SIGNAL_LEN = 8.0;
function signal(t) {
	const flare = seg(t, 4.35, 4.55) * (1 - seg(t, 4.55, 5.4));
	const settle = easeInOut(seg(t, 4.6, 5.8));
	// before the flare the logo is built large in the middle; then it moves up to make room for the words
	const lxp = W / 2, lyp = mix(540, 430, settle), s = mix(0.58, 0.47, settle);
	background("#050506", 0.35 + 0.6 * seg(t, 1, 4.3) + flare * 0.8, lyp, t);

	// the first point of light and its ping
	const dotY = 452;
	const dot = seg(t, 0.15, 0.45) * (1 - seg(t, 1.6, 2.4));
	withLogo(lxp, lyp, s, () => {
		if (dot > 0) {
			head(CX, dotY, 60 + 10 * Math.sin(t * 9), dot);
			for (const [at, k] of [[0.35, 1], [1.0, 0.7]]) {
				const p = seg(t, at, at + 1.1);
				if (p > 0 && p < 1) {
					ctx.save();
					ctx.globalCompositeOperation = "lighter";
					ctx.strokeStyle = rgba(RED, (1 - p) * 0.7 * k);
					ctx.shadowColor = rgba(RED, 1);
					ctx.shadowBlur = 20;
					ctx.lineWidth = 4;
					ctx.beginPath();
					ctx.arc(CX, dotY, 20 + 520 * easeOut(p), 0, Math.PI * 2);
					ctx.stroke();
					ctx.restore();
				}
			}
		}
		drawTile(easeOut(seg(t, 4.62, 5.5)), s);
		// the signal arcs, smallest first, each a pulse
		for (let k = 0; k < 6; k++) {
			const i = 5 - k, at = 0.75 + k * 0.24;
			const d = easeOut(seg(t, at, at + 0.32));
			const pulse = 1 + 0.8 * (1 - seg(t, at + 0.15, at + 0.7));
			drawArc(i, d, Math.min(1.4, pulse) * (1 + flare * 0.6), s);
		}
		// the V: the three lines drawn from their tops down to the point
		for (let i = 2; i >= 0; i--) {
			const at = 2.2 + (2 - i) * 0.16;
			drawV(i, easeInOut(seg(t, at, at + 0.75)), 1 + flare * 0.6, s);
		}
		// the rings, from both sides at once, around to the bottom
		for (let i = 0; i < RINGS.length; i++) {
			const at = 3.05 + i * 0.1;
			drawRing(i, easeInOut(seg(t, at, at + 0.95)), 1 + flare * 0.6, s);
		}
		// the shock of light
		const sp = seg(t, 4.35, 5.6);
		if (sp > 0 && sp < 1) {
			ctx.save();
			ctx.globalCompositeOperation = "lighter";
			const r = 120 + 1500 * easeOut(sp);
			ctx.strokeStyle = rgba([255, 80, 80], 0.55 * (1 - sp));
			ctx.shadowColor = rgba(RED, 1);
			ctx.shadowBlur = 50;
			ctx.lineWidth = 26 * (1 - sp) + 2;
			ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
			ctx.restore();
			for (const k of SPARKS) {
				const age = (t - 4.4) / k.life;
				if (age <= 0 || age >= 1) continue;
				const d = 150 + k.v * easeOut(age) * 1.6;
				head(CX + Math.cos(k.a) * d, CY + Math.sin(k.a) * d, k.size * 9, (1 - age) * 0.8);
			}
		}
	});
	// a flash over everything
	if (flare > 0) {
		ctx.save();
		ctx.globalCompositeOperation = "lighter";
		const g = ctx.createRadialGradient(lxp, lyp, 0, lxp, lyp, 900);
		g.addColorStop(0, `rgba(255,120,110,${0.55 * flare})`);
		g.addColorStop(1, "rgba(255,0,0,0)");
		ctx.fillStyle = g;
		ctx.fillRect(0, 0, W, H);
		ctx.restore();
	}
	// the words come out of the dark; a bar of red light runs along their edges
	const tp = easeOut(seg(t, 5.1, 6.0));
	drawWord(W / 2, mix(820, 795, tp), WORD_W, {
		alpha: tp, blur: 10 * (1 - tp), metal: 0.85, rim: 0.3 + 0.25 * seg(t, 6.0, 6.8),
		orbit: mix(-Math.PI / 2, Math.PI * 1.5, easeInOut(seg(t, 5.6, 7.2))), orbitStrength: 0.9 * seg(t, 5.6, 5.8) * (1 - seg(t, 7.0, 7.4)),
		sweep: mix(-0.4, 1.4, seg(t, 5.9, 7.1)), sweepStrength: 0.35, under: easeInOut(seg(t, 5.5, 6.3)),
	});
	vignette(0.75);
	filmGrain(t, 0.05);
	fade(seg(t, SIGNAL_LEN - 0.55, SIGNAL_LEN));
}

// =============== scene 4: Dark metal ===============
const METAL_LEN = 9.0;
function fog(t, a) {
	if (a <= 0) return;
	ctx.save();
	ctx.globalCompositeOperation = "screen";
	const blobs = [[0.18, 0.78, 520, 0.9], [0.82, 0.82, 600, 1.2], [0.5, 1.0, 760, 0.7], [0.3, 0.3, 420, 1.5], [0.75, 0.25, 460, 1.1]];
	for (const [bx, by, r, sp] of blobs) {
		const x = W * bx + Math.sin(t * 0.25 * sp + bx * 9) * 120, y = H * by + Math.cos(t * 0.2 * sp + by * 7) * 60;
		const g = ctx.createRadialGradient(x, y, 0, x, y, r);
		g.addColorStop(0, `rgba(110,12,18,${0.22 * a})`);
		g.addColorStop(1, "rgba(0,0,0,0)");
		ctx.fillStyle = g;
		ctx.fillRect(0, 0, W, H);
	}
	ctx.restore();
}

function metal(t) {
	// the camera comes closer, very slowly, the whole time
	const cam = mix(0.9, 1.0, easeInOut(seg(t, 0, METAL_LEN)));
	ctx.save();
	ctx.fillStyle = "#060607";
	ctx.fillRect(0, 0, W, H);
	ctx.translate(W / 2, H / 2);
	ctx.scale(cam, cam);
	ctx.translate(-W / 2, -H / 2 + mix(14, 0, seg(t, 0, METAL_LEN)));

	const lx0 = W / 2, ly0 = 420, s = 0.47;
	const back = easeInOut(seg(t, 1.2, 3.6));       // the red light rising behind the logo
	fog(t, seg(t, 4.5, 7.5));
	// the light behind: from below, rising
	if (back > 0) {
		const gy = mix(ly0 + 420, ly0, back);
		const g = ctx.createRadialGradient(lx0, gy, 0, lx0, gy, 620);
		g.addColorStop(0, rgba([170, 12, 20], 0.65 * back));
		g.addColorStop(0.45, rgba([90, 6, 12], 0.32 * back));
		g.addColorStop(1, "rgba(0,0,0,0)");
		ctx.fillStyle = g;
		ctx.fillRect(-200, -200, W + 400, H + 400);
	}
	// the lines catch light one by one, like neon tubes coming on
	const order = [];
	for (let i = 2; i >= 0; i--) order.push(["v", i]);
	for (let i = 0; i < RINGS.length; i++) order.push(["r", i]);
	for (let i = 5; i >= 0; i--) order.push(["a", i]);
	const litOf = (k) => {
		const at = 2.0 + k * 0.17;
		const p = seg(t, at, at + 0.5);
		// a short flicker as the tube starts
		const flick = p > 0 && p < 0.6 ? 0.55 + 0.45 * Math.sin(k * 7 + t * 60) : 1;
		return easeOut(p) * flick;
	};
	withLogo(lx0, ly0, s, () => {
		drawTile(1, s, 0.06 + 0.05 * back);
		order.forEach(([kind, i], k) => {
			const lit = litOf(k);
			if (kind === "v") drawV(i, 1, lit, s);
			else if (kind === "r") drawRing(i, 1, lit, s);
			else drawArc(i, 1, lit, s);
		});
		// the polished-metal reflection: a thin white streak across the tile and its lines
		const sp = seg(t, 4.2, 5.4);
		if (sp > 0 && sp < 1) {
			ctx.save();
			tilePath(); ctx.clip();
			ctx.globalCompositeOperation = "lighter";
			const x = mix(-300, 1350, easeInOut(sp));
			ctx.translate(x, 0);
			ctx.rotate(rad(18));
			const g = ctx.createLinearGradient(-90, 0, 90, 0);
			g.addColorStop(0, "rgba(255,255,255,0)");
			g.addColorStop(0.5, "rgba(255,240,235,0.22)");
			g.addColorStop(1, "rgba(255,255,255,0)");
			ctx.fillStyle = g;
			ctx.fillRect(-90, -400, 180, 1900);
			ctx.fillStyle = "rgba(255,255,255,0.35)";
			ctx.fillRect(-3, -400, 6, 1900);
			ctx.restore();
		}
	});
	// the words: dark metal, then the white light across them, then their red edge
	const ta = easeOut(seg(t, 4.6, 5.8));
	drawWord(W / 2, 795, WORD_W, {
		alpha: ta, metal: mix(0.2, 0.88, seg(t, 5.0, 6.6)), rim: 0.55 * seg(t, 6.0, 7.2),
		sweep: mix(-0.4, 1.4, easeInOut(seg(t, 5.2, 6.6))), sweepStrength: 0.9,
		under: 1, underLit: easeOut(seg(t, 6.0, 6.8)),
	});
	ctx.restore();
	vignette(0.85);
	filmGrain(t, 0.06);
	fade(1 - seg(t, 0, 0.9));
	fade(seg(t, METAL_LEN - 0.6, METAL_LEN));
}

// all the parts of the logo, lit alike (each 0..1 drawn)
function drawAll(lit, s, drawn = 1) {
	for (let i = 0; i < RINGS.length; i++) drawRing(i, drawn, lit, s);
	for (let i = 2; i >= 0; i--) drawV(i, drawn, lit, s);
	for (let i = 0; i < ARCS.length; i++) drawArc(i, drawn, lit, s);
}

// =============== scene 2: Drawing with light ===============
const DRAW_LEN = 8.5;
function grid(a) {
	if (a <= 0) return;
	ctx.save();
	ctx.strokeStyle = `rgba(150,60,64,${0.07 * a})`;
	ctx.lineWidth = 1;
	ctx.beginPath();
	for (let x = (W / 2) % 60; x < W; x += 60) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
	for (let y = 0; y < H; y += 60) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
	ctx.stroke();
	ctx.strokeStyle = `rgba(190,70,74,${0.1 * a})`;
	ctx.beginPath();
	ctx.moveTo(W / 2 + 0.5, 0); ctx.lineTo(W / 2 + 0.5, H); ctx.moveTo(0, 430.5); ctx.lineTo(W, 430.5);
	ctx.stroke();
	ctx.restore();
}

function drawWithLight(t) {
	const lxp = W / 2, lyp = 430, s = 0.47;
	const tileIn = easeOut(seg(t, 5.0, 5.9));
	background("#050506", 0.25 + 0.5 * seg(t, 0.5, 5) + 0.3 * tileIn, lyp, t);
	grid(seg(t, 0, 0.8) * (1 - seg(t, 5.0, 6.0)));
	// just drawn, a line shines whiter, then settles to red
	const fresh = (end) => 1 + 0.7 * (t > end ? 1 - seg(t, end, end + 0.7) : 0);
	withLogo(lxp, lyp, s, () => {
		ctx.save();
		ctx.translate(0, 40 * (1 - tileIn));
		drawTile(tileIn, s, 0.06 + 0.06 * tileIn);
		ctx.restore();
		for (let i = 0; i < RINGS.length; i++) {
			const at = 0.4 + i * 0.32;
			drawRing(i, easeInOut(seg(t, at, at + 1.0)), fresh(at + 1.0), s);
		}
		for (let k = 0; k < 3; k++) {
			const i = 2 - k, at = 2.5 + k * 0.3;
			drawV(i, easeInOut(seg(t, at, at + 0.8)), fresh(at + 0.8), s);
		}
		for (let i = 0; i < ARCS.length; i++) {
			const at = 3.7 + i * 0.18;
			drawArc(i, easeInOut(seg(t, at, at + 0.5)), fresh(at + 0.5), s, false);
		}
	});
	const ta = easeOut(seg(t, 5.6, 6.4));
	drawWord(W / 2, 795, WORD_W, {
		alpha: ta, metal: 0.88, rim: 0.32 * ta, under: easeInOut(seg(t, 5.8, 6.5)),
		sweep: mix(-0.4, 1.4, easeInOut(seg(t, 6.0, 6.9))), sweepStrength: 1.0,
	});
	vignette(0.8);
	filmGrain(t, 0.05);
	fade(1 - seg(t, 0, 0.4));
	fade(seg(t, DRAW_LEN - 0.6, DRAW_LEN));
}

// =============== scene 3: Energy ===============
const ENERGY_LEN = 7.5, HIT = 1.4;
const STREAKS = Array.from({ length: 9 }, (_, i) => {
	const f = (v) => v - Math.floor(v);
	const r = f(Math.sin(i * 91.7) * 4375.5);
	return { a: (i / 9) * Math.PI * 2 + 0.35 + r * 0.3, dur: 0.7 + r * 0.5, arrive: HIT - 0.04 + (r - 0.5) * 0.08, w: 3 + r * 4 };
});
const EMBERS = Array.from({ length: 60 }, (_, i) => {
	const f = (v) => v - Math.floor(v);
	return { x: f(Math.sin(i * 12.3) * 9999) * W, y: f(Math.sin(i * 7.7) * 7777) * H, v: 18 + f(Math.sin(i * 3.1) * 5555) * 40, s: 1 + f(Math.sin(i * 5.9) * 3333) * 2.2, ph: i };
});

function energy(t) {
	const boom = t >= HIT ? Math.exp(-(t - HIT) * 3.2) : 0;
	const shake = t >= HIT ? Math.exp(-(t - HIT) * 5) * 16 : 0;
	ctx.save();
	ctx.translate(Math.sin(t * 91) * shake, Math.cos(t * 77) * shake);
	const move = easeInOut(seg(t, 2.6, 3.4));
	const lxp = W / 2, lyp = mix(540, 430, move);
	background("#050506", 0.3 + 0.5 * seg(t, 0, HIT) + boom, lyp, t);
	// embers drifting up after the hit
	if (t > HIT) {
		ctx.save();
		ctx.globalCompositeOperation = "lighter";
		for (const e of EMBERS) {
			const y = ((e.y - (t - HIT) * e.v * 2) % H + H) % H;
			const a = 0.5 * seg(t, HIT, HIT + 0.6) * (0.5 + 0.5 * Math.sin(t * 3 + e.ph));
			ctx.fillStyle = `rgba(255,70,60,${a})`;
			ctx.beginPath(); ctx.arc(e.x + Math.sin(t + e.ph) * 12, y, e.s, 0, Math.PI * 2); ctx.fill();
		}
		ctx.restore();
	}
	// the streaks rushing to the middle
	ctx.save();
	ctx.globalCompositeOperation = "lighter";
	ctx.lineCap = "round";
	for (const st of STREAKS) {
		const p = seg(t, st.arrive - st.dur, st.arrive);
		if (p <= 0 || p >= 1) continue;
		const d = 1150 * (1 - Math.pow(p, 1.6)), len = 420 * (0.5 + p);
		const hx = W / 2 + Math.cos(st.a) * d, hy = 540 + Math.sin(st.a) * d;
		const tx = W / 2 + Math.cos(st.a) * (d + len), ty = 540 + Math.sin(st.a) * (d + len);
		const g = ctx.createLinearGradient(tx, ty, hx, hy);
		g.addColorStop(0, "rgba(255,30,40,0)");
		g.addColorStop(0.8, "rgba(255,60,60,0.85)");
		g.addColorStop(1, "rgba(255,230,220,1)");
		ctx.strokeStyle = g;
		ctx.shadowColor = rgba(RED, 1);
		ctx.shadowBlur = 24;
		ctx.lineWidth = st.w;
		ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
		head(hx, hy, 26, 0.9);
	}
	ctx.restore();
	// the logo out of the light: larger at first, settling with a small spring
	if (t >= HIT) {
		const p = seg(t, HIT, HIT + 0.9);
		const spring = 1 + 0.32 * Math.exp(-p * 5) * Math.cos(p * 9);
		const s = 0.47 * spring;
		withLogo(lxp, lyp, s, () => {
			drawTile(seg(t, HIT, HIT + 0.3), s, 0.08);
			drawAll(1 + 1.2 * boom, s);
			const sp = seg(t, HIT, HIT + 1.1);
			if (sp < 1) {
				ctx.save();
				ctx.globalCompositeOperation = "lighter";
				for (const [k, r0] of [[1, 100], [0.6, 40]]) {
					ctx.strokeStyle = rgba([255, 110, 100], 0.6 * (1 - sp) * k);
					ctx.shadowColor = rgba(RED, 1);
					ctx.shadowBlur = 50;
					ctx.lineWidth = 34 * (1 - sp) + 2;
					ctx.beginPath(); ctx.arc(CX, CY, r0 + 1900 * easeOut(sp) * k, 0, Math.PI * 2); ctx.stroke();
				}
				ctx.restore();
				for (const k of SPARKS) {
					const age = (t - HIT) / (k.life * 1.2);
					if (age <= 0 || age >= 1) continue;
					const d = 120 + k.v * easeOut(age) * 2.4;
					head(CX + Math.cos(k.a) * d, CY + Math.sin(k.a) * d, k.size * 11, (1 - age) * 0.9);
				}
			}
		});
	}
	// the flash of the hit
	if (t >= HIT - 0.05) {
		const fl = seg(t, HIT - 0.05, HIT) * Math.exp(-Math.max(0, t - HIT) * 4.5);
		ctx.save();
		ctx.globalCompositeOperation = "lighter";
		const g = ctx.createRadialGradient(lxp, lyp, 0, lxp, lyp, 1300);
		g.addColorStop(0, `rgba(255,235,225,${0.95 * fl})`);
		g.addColorStop(0.3, `rgba(255,70,60,${0.6 * fl})`);
		g.addColorStop(1, "rgba(255,0,0,0)");
		ctx.fillStyle = g;
		ctx.fillRect(-100, -100, W + 200, H + 200);
		ctx.restore();
	}
	// the words land with a low boom; the red light runs once around them
	const ta = easeOut(seg(t, 3.3, 3.75));
	const wk = 1 + 0.08 * (1 - ta);
	drawWord(W / 2, 795, WORD_W * wk, {
		alpha: ta, metal: 0.9, rim: 0.35 * ta, under: easeInOut(seg(t, 3.45, 3.95)),
		orbit: mix(-Math.PI / 2, Math.PI * 1.5, easeInOut(seg(t, 3.6, 5.1))), orbitStrength: 1.0 * seg(t, 3.6, 3.8) * (1 - seg(t, 4.9, 5.3)),
		sweep: mix(-0.4, 1.4, easeInOut(seg(t, 3.4, 4.3))), sweepStrength: 0.5,
	});
	ctx.restore();
	vignette(0.8);
	filmGrain(t, 0.05);
	fade(seg(t, ENERGY_LEN - 0.6, ENERGY_LEN));
}
const easeIn = (x) => x * x * x;

// =============== scene 5: Pulse (short) ===============
const PULSE_LEN = 3.6;
function pulse(t) {
	const lxp = 474, lyp = 540, s = 0.32;
	const beats = [0.35, 0.8];
	let lit = 0, flash = 0;
	beats.forEach((b, k) => {
		if (t >= b) {
			lit = k === 0 ? 0.45 : 1;
			flash = Math.max(flash, Math.exp(-(t - b) * 6) * (k === 0 ? 0.6 : 0.9));
		}
	});
	background("#050506", 0.2 + 0.5 * lit + flash, lyp, t, lxp);
	withLogo(lxp, lyp, s, () => {
		drawTile(1, s, 0.07);
		drawAll(lit + flash, s);
		ctx.save();
		ctx.globalCompositeOperation = "lighter";
		beats.forEach((b, k) => {
			const p = seg(t, b, b + 0.9);
			if (p <= 0 || p >= 1) return;
			ctx.strokeStyle = rgba([255, 90, 85], (1 - p) * (k ? 0.75 : 0.5));
			ctx.shadowColor = rgba(RED, 1);
			ctx.shadowBlur = 40;
			ctx.lineWidth = 22 * (1 - p) + 2;
			ctx.beginPath(); ctx.arc(CX, CY, 60 + 900 * easeOut(p), 0, Math.PI * 2); ctx.stroke();
		});
		ctx.restore();
	});
	const ta = easeOut(seg(t, 1.25, 1.85));
	drawWord(1140 - 40 * (1 - ta), 548, 900, {
		alpha: ta, metal: 0.88, rim: 0.32 * ta, under: easeInOut(seg(t, 1.55, 2.1)),
		sweep: mix(-0.4, 1.4, easeInOut(seg(t, 1.8, 2.6))), sweepStrength: 0.8,
	});
	vignette(0.75);
	filmGrain(t, 0.05);
	fade(1 - seg(t, 0, 0.25));
	fade(seg(t, PULSE_LEN - 0.35, PULSE_LEN));
}

// =============== scene 7: Network — the modules fall into place and become the V ===============
const NETWORK_LEN = 7.9;
const NET_TILE = { x0: 240, y0: 194, x1: 783, y1: 728, r: 72 };
const NET_C = [(NET_TILE.x0 + NET_TILE.x1) / 2, (NET_TILE.y0 + NET_TILE.y1) / 2];
// the eight main modules and the node each comes to, in the order they land; the AI comes last, to the tip
// (left and right in turn, and never one falling past another still open)
const MODULES = [["Sales", 7, "sales"], ["CRM", 21, "crm"], ["Manufacturing", 17, "manufacturing"], ["HR & Payroll", 4, "hr"],
	["Purchase", 1, "purchase"], ["Inventory", 27, "inventory"], ["Accounting", 2, "accounting"], ["AI Agents", 30, "ai"]];
const NET_LAND = (() => {
	// when each node is in place: the named ones one by one, the others falling like rain in between
	const land = new Array(NET.nodes.length).fill(0), named = new Set(MODULES.map((m) => m[1]));
	// the AI last, once the others are closed into their nodes (it falls past the middle)
	MODULES.forEach(([, node], i) => (land[node] = i < 7 ? 1.25 + i * 0.4 : 4.65));
	const rest = NET.nodes.map((_, i) => i).filter((i) => !named.has(i));
	rest.sort((a, b) => NET.nodes[a][1] - NET.nodes[b][1] || NET.nodes[a][0] - NET.nodes[b][0]);
	rest.forEach((i, k) => { const f = Math.sin(i * 91.3) * 0.5 + 0.5; land[i] = 2.55 + (k / rest.length) * 1.7 + f * 0.25; });
	return land;
})();
const NET_FALL = (i) => (MODULES.some((m) => m[1] === i) ? 0.9 : 0.5);

// line icons of the modules, drawn on a 24-unit grid around 0,0
function moduleIcon(kind) {
	ctx.beginPath();
	const L = (pts) => { ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); };
	const C = (x, y, r) => { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); };
	switch (kind) {
		case "accounting": // a calculator
			ctx.roundRect(-7, -9, 14, 18, 2); L([-4, -5, 4, -5]);
			for (const [x, y] of [[-4, 0], [0, 0], [4, 0], [-4, 4], [0, 4], [4, 4]]) C(x, y, 0.6);
			break;
		case "sales": // rising bars and an arrow
			L([-8, 8, 9, 8]); L([-6, 8, -6, 3]); L([-1, 8, -1, 0]); L([4, 8, 4, -3]);
			L([-8, -1, -2, -6, 2, -3, 8, -9]); L([4, -9, 8, -9, 8, -5]);
			break;
		case "inventory": // a box
			L([0, -9, 8, -5, 8, 5, 0, 9, -8, 5, -8, -5, 0, -9]); L([-8, -5, 0, -1, 8, -5]); L([0, -1, 0, 9]);
			break;
		case "manufacturing": { // a gear
			for (let k = 0; k < 8; k++) { const a = (k / 8) * Math.PI * 2; L([Math.cos(a) * 6.5, Math.sin(a) * 6.5, Math.cos(a) * 9.2, Math.sin(a) * 9.2]); }
			C(0, 0, 6.5); C(0, 0, 2.6);
			break;
		}
		case "hr": // a person and a coin
			C(-2, -4, 3.6); ctx.moveTo(-9, 9); ctx.quadraticCurveTo(-8, 1, -2, 1); ctx.quadraticCurveTo(4, 1, 5, 6);
			C(6, 5, 3.4); L([6, 3.4, 6, 6.6]);
			break;
		case "purchase": // a cart
			L([-9, -7, -6, -7, -3, 4, 7, 4, 9, -4, -5, -4]); C(-2, 8, 1.4); C(6, 8, 1.4);
			break;
		case "crm": // two people
			C(-3.5, -4, 3.2); ctx.moveTo(-10, 8); ctx.quadraticCurveTo(-9, 1, -3.5, 1); ctx.quadraticCurveTo(2, 1, 3, 8);
			C(4.5, -2.5, 2.6); ctx.moveTo(5.5, 2.5); ctx.quadraticCurveTo(9.5, 3, 10, 8);
			break;
		case "ai": { // a spark and a small one
			const star = (x, y, r) => { ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); };
			star(-2, 1, 8); star(6.5, -6.5, 3.2);
			break;
		}
	}
	ctx.stroke();
}

function netCamera(t) {
	// close on the V while the modules land, then back to the whole logo
	const z = easeInOut(seg(t, 4.6, 5.7));
	const zoom = mix(2.35, 1.62, z) * (1 + 0.04 * (1 - seg(t, 0, 4.6)));
	const fx = 511, fy = 472;
	return { zoom, fx, fy, s: 0.6 * zoom, sx: W / 2, sy: mix(540, 430, z) };
}
function netToScreen(cam, x, y) { return [cam.sx + (x - cam.fx) * cam.s, cam.sy + (y - cam.fy) * cam.s]; }

function network(t) {
	const cam = netCamera(t);
	background("#050506", 0.25 + 0.45 * seg(t, 1, 4.6) + 0.35 * Math.exp(-Math.pow((t - 5.25) / 0.35, 2)), 420, t);
	// a faint drift of red dust
	ctx.save();
	ctx.globalCompositeOperation = "lighter";
	for (let k = 0; k < 70; k++) {
		const f = (v) => v - Math.floor(v);
		const x = f(Math.sin(k * 12.9) * 4375) * W, y = (f(Math.sin(k * 78.2) * 9999) * H + t * (12 + 20 * f(k * 0.37))) % H;
		ctx.fillStyle = `rgba(255,60,60,${0.12 + 0.12 * Math.sin(t * 2 + k)})`;
		ctx.beginPath(); ctx.arc(x, y, 1 + 1.6 * f(k * 0.71), 0, Math.PI * 2); ctx.fill();
	}
	ctx.restore();
	// the tile comes in behind once the V is whole
	const tileA = 0; // no tile around the network V
	if (tileA > 0) {
		ctx.save();
		ctx.translate(cam.sx, cam.sy); ctx.scale(cam.s, cam.s); ctx.translate(-cam.fx, -cam.fy);
		ctx.globalAlpha = tileA;
		ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 22;
		const g = ctx.createLinearGradient(0, NET_TILE.y0, 0, NET_TILE.y1);
		g.addColorStop(0, "#1d1f24"); g.addColorStop(1, "#0c0d10");
		ctx.fillStyle = g;
		ctx.beginPath(); ctx.roundRect(NET_TILE.x0, NET_TILE.y0, NET_TILE.x1 - NET_TILE.x0, NET_TILE.y1 - NET_TILE.y0, NET_TILE.r); ctx.fill();
		ctx.shadowColor = "transparent";
		const e = ctx.createLinearGradient(0, NET_TILE.y0, 0, NET_TILE.y1);
		e.addColorStop(0, "rgba(255,255,255,0.16)"); e.addColorStop(0.5, "rgba(255,255,255,0.03)"); e.addColorStop(1, "rgba(0,0,0,0.5)");
		ctx.strokeStyle = e; ctx.lineWidth = 3 / cam.s;
		ctx.beginPath(); ctx.roundRect(NET_TILE.x0, NET_TILE.y0, NET_TILE.x1 - NET_TILE.x0, NET_TILE.y1 - NET_TILE.y0, NET_TILE.r); ctx.stroke();
		ctx.restore();
	}
	// the pulse that runs up from the tip when all is in place
	const wave = seg(t, 5.05, 5.85), apex = NET.nodes[30];
	const waveY = mix(apex[1] + 20, NET_TILE.y0 - 40, easeOut(wave));
	const boost = (y) => (wave > 0 && wave < 1 ? Math.exp(-Math.pow((y - waveY) / 45, 2)) * 1.6 : 0);
	// the lines: each drawn from the node that was there first, once both are in place
	ctx.save();
	ctx.globalCompositeOperation = "lighter";
	ctx.lineCap = "round";
	for (const [i, j] of NET.edges) {
		const a = NET_LAND[i] <= NET_LAND[j] ? i : j, b = a === i ? j : i;
		const p = easeOut(seg(t, NET_LAND[b], NET_LAND[b] + 0.32));
		if (p <= 0) continue;
		const [x0, y0] = netToScreen(cam, ...NET.nodes[a]), [x1, y1] = netToScreen(cam, ...NET.nodes[b]);
		const xe = mix(x0, x1, p), ye = mix(y0, y1, p);
		const fresh = 1 - seg(t, NET_LAND[b] + 0.2, NET_LAND[b] + 0.9);
		const lit = 0.55 + 0.45 * fresh + boost((NET.nodes[a][1] + NET.nodes[b][1]) / 2);
		ctx.strokeStyle = `rgba(255,${Math.round(55 + 90 * fresh)},${Math.round(55 + 70 * fresh)},${Math.min(1, 0.85 * lit)})`;
		ctx.shadowColor = rgba(RED, 0.9);
		ctx.shadowBlur = 6;
		ctx.lineWidth = Math.max(1.1, 1.6 * cam.s);
		ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(xe, ye); ctx.stroke();
	}
	ctx.restore();
	// the nodes: falling, then in place; the named ones as circles with their icon and name
	MODULES.forEach(([name, node, kind], i) => drawModule(t, cam, name, node, kind, boost));
	NET.nodes.forEach((n, i) => {
		if (MODULES.some((m) => m[1] === i)) return;
		const land = NET_LAND[i], fall = NET_FALL(i);
		const p = seg(t, land - fall, land);
		if (p <= 0) return;
		const [x, y] = netToScreen(cam, ...n);
		const r = 5.2 * cam.s;
		if (p < 1) {
			// a falling spark with its trail
			const yy = mix(-60, y, p * p);
			ctx.save();
			ctx.globalCompositeOperation = "lighter";
			const g = ctx.createLinearGradient(x, yy - 90, x, yy);
			g.addColorStop(0, "rgba(255,40,40,0)"); g.addColorStop(1, "rgba(255,120,110,0.8)");
			ctx.strokeStyle = g; ctx.lineWidth = 2;
			ctx.beginPath(); ctx.moveTo(x, yy - 90); ctx.lineTo(x, yy); ctx.stroke();
			ctx.restore();
			head(x, yy, 16, 0.9);
		} else {
			nodeDot(x, y, r, 1 + 1.4 * (1 - seg(t, land, land + 0.4)) + boost(n[1]));
			const fl = seg(t, land, land + 0.45);
			if (fl < 1) ring(x, y, 6 + 26 * easeOut(fl), (1 - fl) * 0.7);
		}
	});
	// the words
	const wa = easeOut(seg(t, 5.75, 6.5));
	drawWord(W / 2, 745, 420, {
		alpha: wa, metal: 0.88, rim: 0.32 * wa, under: easeInOut(seg(t, 6.0, 6.6)),
		orbit: mix(-Math.PI / 2, Math.PI * 1.5, easeInOut(seg(t, 6.1, 7.3))), orbitStrength: 0.9 * seg(t, 6.1, 6.3) * (1 - seg(t, 7.1, 7.4)),
		sweep: mix(-0.4, 1.4, easeInOut(seg(t, 6.2, 7.1))), sweepStrength: 0.5,
	});
	vignette(0.75);
	filmGrain(t, 0.05);
	fade(1 - seg(t, 0, 0.35));
	fade(seg(t, NETWORK_LEN - 0.5, NETWORK_LEN));
}

function nodeDot(x, y, r, lit) {
	ctx.save();
	ctx.globalCompositeOperation = "lighter";
	const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.6);
	g.addColorStop(0, rgba([255, 60, 60], Math.min(1, 0.5 * lit)));
	g.addColorStop(1, "rgba(255,0,0,0)");
	ctx.fillStyle = g;
	ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
	ctx.fillStyle = rgba([255, 200, 190], Math.min(1, 0.85 * lit));
	ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
	ctx.restore();
}
function ring(x, y, r, a) {
	if (a <= 0) return;
	ctx.save();
	ctx.globalCompositeOperation = "lighter";
	ctx.strokeStyle = `rgba(255,90,85,${a})`;
	ctx.lineWidth = 2;
	ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
	ctx.restore();
}

function drawModule(t, cam, name, node, kind, boost) {
	const land = NET_LAND[node], fall = NET_FALL(node);
	const p = seg(t, land - fall, land);
	if (p <= 0) return;
	const [x, y] = netToScreen(cam, ...NET.nodes[node]);
	const R = 46;
	if (p < 1) {
		// falling, slowing as it arrives, with a short trail of light above it
		const e = 1 - Math.pow(1 - p, 3);
		const yy = mix(-R - 40, y, e), sp = 3 * Math.pow(1 - p, 2);
		ctx.save();
		ctx.globalCompositeOperation = "lighter";
		for (const dx of [-R * 0.55, 0, R * 0.55]) {
			const len = (dx ? 120 : 190) * Math.min(1, sp);
			const g = ctx.createLinearGradient(x, yy - R - len, x, yy - R * 0.7);
			g.addColorStop(0, "rgba(255,40,40,0)"); g.addColorStop(1, `rgba(255,90,80,${(dx ? 0.35 : 0.6) * Math.min(1, sp)})`);
			ctx.strokeStyle = g; ctx.lineWidth = dx ? 1.2 : 2;
			ctx.beginPath(); ctx.moveTo(x + dx, yy - R - len); ctx.lineTo(x + dx, yy - R * (dx ? 0.85 : 0.7)); ctx.stroke();
		}
		ctx.restore();
		moduleBadge(x, yy, R, name, kind, 1, 1);
		return;
	}
	// in place: the circle closes into its node, its name fades
	const q = seg(t, land, land + 0.32);
	const r = mix(R, 6 * cam.s, easeInOut(q));
	if (q < 1) {
		moduleBadge(x, y, r, name, kind, 1 - q, 1 - seg(t, land + 0.05, land + 0.3));
		const fl = seg(t, land, land + 0.6);
		ring(x, y, R * 0.6 + 70 * easeOut(fl), (1 - fl) * 0.8);
		head(x, y, 60 * (1 - fl), 1 - fl);
	}
	nodeDot(x, y, 6 * cam.s, (q < 1 ? q : 1) * (1 + 1.6 * (1 - seg(t, land + 0.2, land + 0.8))) + boost(NET.nodes[node][1]));
}

function moduleBadge(x, y, R, name, kind, iconA, labelA) {
	ctx.save();
	// the circle: dark glass with a red ring of light
	ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
	const g = ctx.createRadialGradient(x, y - R * 0.4, 0, x, y, R);
	g.addColorStop(0, "rgba(42,44,52,0.97)"); g.addColorStop(1, "rgba(14,15,19,0.97)");
	ctx.fillStyle = g;
	ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
	ctx.shadowOffsetY = 0;
	ctx.globalCompositeOperation = "lighter";
	ctx.shadowColor = rgba(RED, 0.9); ctx.shadowBlur = 16;
	ctx.strokeStyle = "rgba(255,50,55,0.95)"; ctx.lineWidth = Math.max(1.5, R * 0.055);
	ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
	ctx.globalCompositeOperation = "source-over";
	ctx.shadowColor = "transparent";
	if (iconA > 0.02 && R > 10) {
		ctx.translate(x, y);
		const k = R / 22;
		ctx.scale(k, k);
		ctx.strokeStyle = `rgba(240,240,244,${iconA})`;
		ctx.fillStyle = "transparent";
		ctx.lineWidth = 1.7;
		ctx.lineJoin = "round"; ctx.lineCap = "round";
		moduleIcon(kind);
		ctx.setTransform(1, 0, 0, 1, 0, 0);
	}
	if (labelA > 0.02) {
		ctx.font = "600 22px Inter";
		ctx.letterSpacing = "1px";
		ctx.textAlign = "center";
		ctx.textBaseline = "top";
		ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 8;
		ctx.fillStyle = `rgba(236,236,240,${labelA})`;
		ctx.fillText(name.toUpperCase(), x, y + R + 12);
	}
	ctx.restore();
}

window.SCENES = { signal: [signal, SIGNAL_LEN], draw: [drawWithLight, DRAW_LEN], energy: [energy, ENERGY_LEN],
	metal: [metal, METAL_LEN], pulse: [pulse, PULSE_LEN], network: [network, NETWORK_LEN] };
window.render = (t, scene) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = "none"; SCENES[scene][0](t); };
window.ready = Promise.all([maskReady, document.fonts.load("600 22px Inter")]).then(() => true);
</script>
</body></html>
