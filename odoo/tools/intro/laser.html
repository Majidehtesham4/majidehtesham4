<html><head><meta charset="utf-8">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<script type="importmap">{"imports": {"three": "./package/build/three.module.js", "three/addons/": "./package/examples/jsm/"}}</script>

<script type="module">
// «Laser engraving»: a laser cuts the VERON logo into a plate of polished black steel. The grooves are real
// geometry below the surface (seen through a stencil), filled with metal that melts white-hot and cools to the
// logo's red; sparks fly and bounce, smoke rises, the air shimmers; the camera follows the light, then rises to
// show the whole logo, and a last small laser draws the line under ERP. render(t) draws the frame at t seconds.
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const W = 1920, H = 1080, LEN = 12.0;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const mix = (a, b, x) => a + (b - a) * x;
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const smooth = (x) => x * x * (3 - 2 * x);
function rng(seed) {
	return function () {
		seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
		let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
}

// ---------------------------------------------------------------- the logo (traced, in 1032 x 1048 px)
const CX = 512, CY = 532, TOPY = 288, SLOPE = 0.5, VW = 24, APEX = [610, 725, 855];
const ARCS = [[207, 162, 30, 22], [250, 140, 26, 16], [292, 120, 24, 16], [335, 100, 22, 15], [377, 78, 20, 14], [412, 57, 16, 12]]
	.map(([y, h, s, w]) => { const R = (h * h + s * s) / (2 * s), phi = Math.asin(h / R); return { cy: y + R, R, a0: -Math.PI / 2 - phi, a1: -Math.PI / 2 + phi, w }; });
const RINGS = [[330, 26, 221, 100], [281, 20, 233, 104], [235, 18, 233, 108], [199, 13, 240, 150], [160, 11, 235, 165]]
	.map(([r, w, up, low]) => ({ r, w, up: (up * Math.PI) / 180, low: (low * Math.PI) / 180 }));
const wx = (x) => (x - 511) / 100, wz = (y) => (y - 526) / 100;
function inGap(x, y) {
	const d = 30, apexY = APEX[2] + d / Math.sin(Math.atan(SLOPE));
	return y < apexY && Math.abs(x - CX) < (apexY - y) * SLOPE;
}

// a path: its points in the world, which of them fall in a gap, their distance along it
function makePath(name, ptsPx, widthPx, opts = {}) {
	const pts = ptsPx.map(([x, y]) => new THREE.Vector3(opts.world ? x : wx(x), opts.y ?? 0, opts.world ? y : wz(y)));
	const gap = ptsPx.map(([x, y]) => (opts.gaps ? inGap(x, y) : false));
	const s = [0];
	for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + pts[i].distanceTo(pts[i - 1]));
	return { name, pts, gap, s, L: s[s.length - 1], hw: (opts.world ? widthPx : widthPx / 100) / 2, y: opts.y ?? 0 };
}
function arcPts(cx, cy, R, a0, a1) {
	const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) * R / 2));
	return Array.from({ length: n + 1 }, (_, i) => { const a = mix(a0, a1, i / n); return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
}
function linePts(points) {
	const out = [];
	for (let k = 1; k < points.length; k++) {
		const [x0, y0] = points[k - 1], [x1, y1] = points[k];
		const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 2);
		for (let i = k === 1 ? 0 : 1; i <= n; i++) out.push([mix(x0, x1, i / n), mix(y0, y1, i / n)]);
	}
	return out;
}
const PATHS = {};
for (let i = 0; i < 3; i++) {
	const half = (APEX[i] - TOPY) * SLOPE;
	PATHS["v" + i] = makePath("v" + i, linePts([[CX - half, TOPY], [CX, APEX[i]], [CX + half, TOPY]]), VW);
}
RINGS.forEach((r, i) => {
	PATHS["rl" + i] = makePath("rl" + i, arcPts(CX, CY, r.r, r.up, r.low), r.w, { gaps: true });
	PATHS["rr" + i] = makePath("rr" + i, arcPts(CX, CY, r.r, Math.PI - r.up, Math.PI - r.low), r.w, { gaps: true });
});
ARCS.forEach((a, i) => (PATHS["a" + i] = makePath("a" + i, arcPts(CX, a.cy, a.R, a.a0, a.a1), a.w)));

// the wordmark, flat on the floor below the plate, and the line under ERP
const FLOOR = -0.6, WORD_W = 16.8, WORD_Z = 7.18, MASK_W = 1755, MASK_H = 290;
const WORD_H = (WORD_W * MASK_H) / MASK_W, WK = WORD_W / MASK_W;
const UNDER = [[1298, 258], [1740, 258]].map(([x, y]) => [(x - MASK_W / 2) * WK, WORD_Z + (y - MASK_H / 2) * WK]);
PATHS.under = makePath("under", linePts(UNDER), 0.12, { world: true, y: FLOOR });

// ---------------------------------------------------------------- the lasers and when they cut what
const LASERS = [];
function inverse(ease) {
	const N = 400, table = Array.from({ length: N + 1 }, (_, i) => ease(i / N));
	return (u) => {
		let lo = 0, hi = N;
		while (hi - lo > 1) { const m = (lo + hi) >> 1; if (table[m] < u) lo = m; else hi = m; }
		const f = (u - table[lo]) / Math.max(1e-9, table[hi] - table[lo]);
		return (lo + clamp(f)) / N;
	};
}
function laser(jobs, opts = {}) {
	jobs.forEach((j) => (j.inv = inverse(j.ease)));
	LASERS.push({ jobs, power: opts.power ?? 1, sparks: opts.sparks ?? 1 });
}
const linear = (x) => x;
laser([{ path: PATHS.v2, t0: 1.57, t1: 5.2, ease: (x) => 0.32 * x + 0.68 * x * x }], { power: 1.25, sparks: 1.4 });
// the rest: six lasers, each a part of the logo around its centre, all done by 8.3 s
(() => {
	const rest = Object.values(PATHS).filter((p) => p.name !== "v2" && p.name !== "under");
	const mid = (p) => p.pts[Math.floor(p.pts.length / 2)];
	rest.sort((a, b) => Math.atan2(mid(a).z, mid(a).x) - Math.atan2(mid(b).z, mid(b).x));
	const total = rest.reduce((a, p) => a + p.L, 0), groups = [[]];
	let acc = 0;
	for (const p of rest) {
		if (acc > (total / 6) * groups.length && groups.length < 6) groups.push([]);
		groups[groups.length - 1].push(p);
		acc += p.L;
	}
	groups.forEach((g, k) => {
		const start = 5.15 + k * 0.1, end = 8.3, len = g.reduce((a, p) => a + p.L, 0);
		const speed = len / (end - start - 0.08 * (g.length - 1));
		let t = start;
		laser(g.map((p) => { const job = { path: p, t0: t, t1: t + p.L / speed, ease: linear }; t = job.t1 + 0.08; return job; }), { power: 0.85, sparks: 0.8 });
	});
})();
laser([{ path: PATHS.under, t0: 9.1, t1: 9.8, ease: easeInOut }], { power: 0.7, sparks: 0.7 });

function pointAt(path, s) {
	let lo = 0, hi = path.s.length - 1;
	while (hi - lo > 1) { const m = (lo + hi) >> 1; if (path.s[m] < s) lo = m; else hi = m; }
	const f = clamp((s - path.s[lo]) / Math.max(1e-9, path.s[hi] - path.s[lo]));
	const p = path.pts[lo].clone().lerp(path.pts[hi], f);
	const dir = path.pts[hi].clone().sub(path.pts[lo]).normalize();
	return { p, dir, gap: path.gap[lo] || path.gap[hi] };
}
// where a laser is at t, whether it is on
function laserState(L, t) {
	for (const j of L.jobs) {
		if (t >= j.t0 && t <= j.t1) {
			const at = pointAt(j.path, j.path.L * j.ease((t - j.t0) / (j.t1 - j.t0)));
			return { ...at, on: !at.gap, path: j.path };
		}
	}
	// between jobs or after: where it was last, off
	let last = null;
	for (const j of L.jobs) if (t > j.t1) last = j;
	if (last) return { ...pointAt(last.path, last.path.L), on: false, path: last.path };
	const first = L.jobs[0];
	return { ...pointAt(first.path, 0), on: false, path: first.path };
}
// the time the laser cut each point of a path
const cutTimes = new Map();
for (const L of LASERS) for (const j of L.jobs) cutTimes.set(j.path, j.path.s.map((s) => j.t0 + j.inv(s / j.path.L) * (j.t1 - j.t0)));

// ---------------------------------------------------------------- renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, stencil: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.02, 500);
const pmrem = new THREE.PMREMGenerator(renderer);
// a dark studio: black, with a few long soft strip lights, as on a set; the steel reflects only these
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x000000);
for (const [w, h, x, y, z, I] of [[34, 1.6, 0, 10, -22, 1.6], [1.4, 26, -24, 7, 4, 0.7], [1.4, 26, 24, 9, -6, 0.45], [14, 14, 0, 32, 4, 0.32]]) {
	const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(I, I * 0.98, I * 1.04), side: THREE.DoubleSide }));
	m.position.set(x, y, z);
	m.lookAt(0, 0, 0);
	studio.add(m);
}
scene.environment = pmrem.fromScene(studio, 0.02).texture;

// textures made here: brushed steel, a soft puff, a round glow
function canvasTex(size, draw, repeat) {
	const c = document.createElement("canvas");
	c.width = c.height = size;
	draw(c.getContext("2d"), size);
	const t = new THREE.CanvasTexture(c);
	if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
	t.anisotropy = 8;
	return t;
}
const R0 = rng(5);
const brushed = canvasTex(1024, (g, n) => {
	g.fillStyle = "rgb(128,128,128)"; g.fillRect(0, 0, n, n);
	for (let i = 0; i < 9000; i++) {
		const v = 128 + (R0() - 0.5) * 70, y = R0() * n, l = 40 + R0() * 500, x = R0() * n;
		g.strokeStyle = `rgba(${v},${v},${v},${0.25 + R0() * 0.35})`;
		g.lineWidth = 0.5 + R0() * 1.2;
		g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (R0() - 0.5) * 0.6); g.stroke();
	}
	for (let i = 0; i < 40; i++) {
		// a few fine scratches
		g.strokeStyle = `rgba(200,200,200,${0.15 + R0() * 0.2})`;
		g.lineWidth = 0.6;
		const x = R0() * n, y = R0() * n, a = R0() * Math.PI, l = 30 + R0() * 160;
		g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
	}
}, 0.18);
const glowTex = canvasTex(256, (g, n) => {
	const r = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
	r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.12, "rgba(255,255,255,0.6)");
	r.addColorStop(0.4, "rgba(255,255,255,0.12)"); r.addColorStop(1, "rgba(255,255,255,0)");
	g.fillStyle = r; g.fillRect(0, 0, n, n);
});
const puffTex = canvasTex(256, (g, n) => {
	const R = rng(9);
	for (let i = 0; i < 60; i++) {
		const x = n / 2 + (R() - 0.5) * n * 0.45, y = n / 2 + (R() - 0.5) * n * 0.45, r = n * (0.12 + R() * 0.22);
		const gr = g.createRadialGradient(x, y, 0, x, y, r);
		gr.addColorStop(0, "rgba(255,255,255,0.10)"); gr.addColorStop(1, "rgba(255,255,255,0)");
		g.fillStyle = gr; g.fillRect(0, 0, n, n);
	}
});

// ---------------------------------------------------------------- the plate and the floor
const stencilOut = { stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc,
	stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp, stencilZPass: THREE.KeepStencilOp };
const plateMat = new THREE.MeshPhysicalMaterial({ color: 0x4d5259, metalness: 1.0, roughness: 0.32, roughnessMap: brushed,
	clearcoat: 0.3, clearcoatRoughness: 0.16, envMapIntensity: 0.9, ...stencilOut });
const shape = new THREE.Shape();
shape.moveTo(0, 0);
(() => {
	const x0 = wx(54), x1 = wx(968), y0 = -wz(984), y1 = -wz(68), r = 1.32;
	shape.moveTo(x0 + r, y0); shape.lineTo(x1 - r, y0); shape.quadraticCurveTo(x1, y0, x1, y0 + r);
	shape.lineTo(x1, y1 - r); shape.quadraticCurveTo(x1, y1, x1 - r, y1); shape.lineTo(x0 + r, y1);
	shape.quadraticCurveTo(x0, y1, x0, y1 - r); shape.lineTo(x0, y0 + r); shape.quadraticCurveTo(x0, y0, x0 + r, y0);
})();
const plateGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.48, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 6, curveSegments: 32 });
plateGeo.rotateX(-Math.PI / 2);
plateGeo.translate(0, -0.54, 0);
const plate = new THREE.Mesh(plateGeo, plateMat);
plate.renderOrder = 1;
scene.add(plate);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x010101, roughness: 0.9, metalness: 0, envMapIntensity: 0.0, ...stencilOut }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR;
floor.renderOrder = 1;
scene.add(floor);
const PLATE = { x0: wx(54), x1: wx(968), z0: wz(68), z1: wz(984) };

// ---------------------------------------------------------------- the grooves
const NL = 10; // lights the grooves know: the lasers, the sweep over the words, the red glow
const grooveUniforms = {
	uTime: { value: 0 }, uGlow: { value: 1 },
	uLP: { value: Array.from({ length: NL }, () => new THREE.Vector3(0, -100, 0)) },
	uLC: { value: Array.from({ length: NL }, () => new THREE.Vector3()) },
	uKeyDir: { value: new THREE.Vector3(-0.5, 0.7, -0.5).normalize() }, uKeyCol: { value: new THREE.Vector3(0.25, 0.27, 0.3) },
};
const NOISE = `
	float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
	float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
		return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
`;
const grooveVS = `
	attribute float aU; attribute float aCut; attribute float aS;
	varying vec3 vPos; varying vec3 vN; varying float vU; varying float vCut; varying float vS;
	void main() { vU = aU; vCut = aCut; vS = aS; vN = normal; vec4 w = modelMatrix * vec4(position, 1.0); vPos = w.xyz;
		gl_Position = projectionMatrix * viewMatrix * w; }
`;
const grooveFS = `
	uniform float uTime; uniform float uGlow; uniform vec3 uLP[${NL}]; uniform vec3 uLC[${NL}]; uniform vec3 uKeyDir; uniform vec3 uKeyCol;
	varying vec3 vPos; varying vec3 vN; varying float vU; varying float vCut; varying float vS;
	${NOISE}
	void main() {
		float age = uTime - vCut;
		if (age < 0.0) discard;
		float au = abs(vU);
		vec3 N = normalize(vN), V = normalize(cameraPosition - vPos);
		vec3 base = vec3(0.05, 0.052, 0.058), col = vec3(0.0);
		for (int i = 0; i < ${NL}; i++) {
			vec3 L = uLP[i] - vPos; float d2 = dot(L, L); L /= sqrt(d2);
			float dif = max(dot(N, L), 0.0); float sp = pow(max(dot(N, normalize(L + V)), 0.0), 50.0);
			col += uLC[i] * (dif * base * 2.5 + sp * 0.5) / (d2 + 0.015);
		}
		col += uKeyCol * (max(dot(N, uKeyDir), 0.0) * base * 2.0 + pow(max(dot(N, normalize(uKeyDir + V)), 0.0), 40.0) * 0.25);
		// the metal in the groove: white-hot where just cut, then yellow, orange, and the logo's red
		float n = noise(vec2(vS * 9.0, vU * 2.5 + uTime * 1.7)) * 0.65 + noise(vec2(vS * 31.0, uTime * 3.0)) * 0.35;
		float temp = exp(-age / 0.42);
		float tt = clamp(temp * (0.78 + 0.45 * n), 0.0, 1.0);
		vec3 hot = tt > 0.55 ? mix(vec3(1.0, 0.42, 0.07), vec3(1.0, 0.93, 0.78), (tt - 0.55) / 0.45)
			: mix(vec3(0.75, 0.05, 0.015), vec3(1.0, 0.42, 0.07), tt / 0.55);
		float core = 1.0 - smoothstep(0.38, 0.72, au);
		float core2 = 1.0 - smoothstep(0.72, 1.0, au);
		vec3 red = vec3(1.0, 0.012, 0.03);
		float cool = smoothstep(0.1, 1.6, age);
		vec3 e = core * hot * pow(tt, 1.6) * 7.0 + core2 * red * (1.15 + 0.25 * n) * cool * uGlow;
		col += (1.0 - core) * hot * pow(tt, 1.8) * 0.9 + (1.0 - core2) * red * 0.3 * uGlow * cool;
		gl_FragColor = vec4(col + e, 1.0);
	}
`;
const haloFS = `
	uniform float uTime; uniform float uGlow; varying vec3 vPos; varying vec3 vN; varying float vU; varying float vCut; varying float vS;
	void main() {
		float age = uTime - vCut; float au = abs(vU);
		if (age < 0.0 || au < 1.0) discard;
		float f = pow(clamp(1.0 - (au - 1.0) / 0.95, 0.0, 1.0), 2.2);
		vec3 e = vec3(1.0, 0.22, 0.04) * exp(-age / 0.35) * 1.2 * f + vec3(1.0, 0.03, 0.045) * 0.16 * f * smoothstep(0.3, 1.8, age) * uGlow;
		gl_FragColor = vec4(e, 1.0);
	}
`;
const mouthFS = `
	uniform float uTime; varying float vCut; varying float vU; varying vec3 vPos; varying vec3 vN; varying float vS;
	void main() { if (uTime < vCut || abs(vU) > 1.0) discard; gl_FragColor = vec4(0.0); }
`;
const mouthMat = new THREE.ShaderMaterial({ uniforms: grooveUniforms, vertexShader: grooveVS, fragmentShader: mouthFS,
	colorWrite: false, depthWrite: false, stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc,
	stencilZPass: THREE.ReplaceStencilOp, stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp, side: THREE.DoubleSide });
const grooveMat = new THREE.ShaderMaterial({ uniforms: grooveUniforms, vertexShader: grooveVS, fragmentShader: grooveFS,
	stencilWrite: true, stencilRef: 1, stencilFunc: THREE.EqualStencilFunc, stencilZPass: THREE.KeepStencilOp,
	stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp, side: THREE.DoubleSide });
const haloMat = new THREE.ShaderMaterial({ uniforms: grooveUniforms, vertexShader: grooveVS, fragmentShader: haloFS,
	transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });

// the U-shaped groove of a path (and its flat mouth, and the glow around it on the surface), with rounded ends
function grooveGeometry(path, times) {
	const K = 9, depthK = 0.55;
	const groove = { pos: [], nor: [], u: [], cut: [], s: [], idx: [] };
	const mouth = { pos: [], nor: [], u: [], cut: [], s: [], idx: [] };
	const halo = { pos: [], nor: [], u: [], cut: [], s: [], idx: [] };
	const hw = path.hw, depth = hw * depthK, y0 = path.y;
	const runs = [];
	let run = [];
	path.pts.forEach((p, i) => { if (!path.gap[i]) run.push(i); else if (run.length) { runs.push(run); run = []; } });
	if (run.length) runs.push(run);
	const push = (G, x, y, z, nx, ny, nz, u, c, s) => { G.pos.push(x, y, z); G.nor.push(nx, ny, nz); G.u.push(u); G.cut.push(c); G.s.push(s); };
	for (const r of runs) {
		if (r.length < 2) continue;
		const off = r.map((i, k) => {
			const a = path.pts[r[Math.max(0, k - 1)]], b = path.pts[r[Math.min(r.length - 1, k + 1)]];
			const prev = k > 0 ? path.pts[i].clone().sub(a).normalize() : b.clone().sub(path.pts[i]).normalize();
			const next = k < r.length - 1 ? b.clone().sub(path.pts[i]).normalize() : prev.clone();
			const n1 = new THREE.Vector3(-prev.z, 0, prev.x), n2 = new THREE.Vector3(-next.z, 0, next.x);
			const n = n1.clone().add(n2).normalize();
			return n.multiplyScalar(1 / Math.max(0.3, n.dot(n1)));
		});
		// the groove: K columns across, the depth a parabola
		const gStart = groove.pos.length / 3, mStart = mouth.pos.length / 3, hStart = halo.pos.length / 3;
		r.forEach((i, k) => {
			const p = path.pts[i], o = off[k], c = times[i], s = path.s[i];
			const nn = o.clone().normalize();
			for (let j = 0; j < K; j++) {
				const u = -1 + (2 * j) / (K - 1), slope = (2 * depth * u) / hw;
				const nv = new THREE.Vector3(-slope * nn.x, 1, -slope * nn.z).normalize();
				push(groove, p.x + o.x * u * hw, y0 - depth * (1 - u * u), p.z + o.z * u * hw, nv.x, nv.y, nv.z, u, c, s);
			}

		const src = P.clone().add(SOURCE);
		const end = src.clone().lerp(P, reach);
		const beamOn = on * (k === 0 ? 1 : seg(t, L.jobs[0].t0 - 0.1, L.jobs[0].t0));
		u.mat.uniforms.uOn.value = beamOn * L.power;
		u.mat.uniforms.uTime.value = t;
		const axis = end.clone().sub(src), mid = src.clone().add(end).multiplyScalar(0.5);
		const side = axis.clone().cross(camera.position.clone().sub(mid)).normalize().multiplyScalar(0.05 + 0.0025 * cam.dist);
		const pa = u.beam.geometry.attributes.position;
		pa.setXYZ(0, src.x - side.x, src.y - side.y, src.z - side.z); pa.setXYZ(1, src.x + side.x, src.y + side.y, src.z + side.z);
		pa.setXYZ(2, end.x - side.x, end.y - side.y, end.z - side.z); pa.setXYZ(3, end.x + side.x, end.y + side.y, end.z + side.z);
		pa.needsUpdate = true;
		const touching = beamOn > 0 && reach >= 1 && st.on ? 1 : 0;
		const fl = touching * L.power * flick;
		u.flare.position.copy(P).setY(P.y + 0.02);
		const fs = (0.11 + 0.004 * cam.dist) * (0.85 + 0.3 * flick);
		u.flare.scale.set(fs, fs, 1);
		u.flare.material.opacity = fl;
		u.streak.position.copy(u.flare.position);
		u.streak.scale.set(fs * 14, fs * 0.22, 1);
		u.streak.material.opacity = fl * 0.8;
		u.light.position.copy(P).setY(P.y + LIGHT_LIFT);
		u.light.intensity = 0.12 * fl;
		grooveUniforms.uLP.value[k].copy(u.light.position);
		grooveUniforms.uLC.value[k].set(1.0, 0.54, 0.3).multiplyScalar(u.light.intensity * 0.6);
		if (fl > 0) {
			tmp.copy(P).project(camera);
			hot.push(new THREE.Vector3(tmp.x * 0.5 + 0.5, tmp.y * 0.5 + 0.5, 0.6 * fl / (1 + 0.15 * cam.dist)));
		}
	});
	// the aiming dot
	const aimA = seg(t, 0.55, 0.75) * (1 - seg(t, 1.5, 1.6)) * (0.75 + 0.25 * Math.sin(t * 40));
	aim.position.copy(V2.pts[0]).setY(0.01);
	aim.scale.set(0.05, 0.05, 1);
	aim.material.opacity = aimA;
	haze.uniforms.uHot.value.forEach((v, i) => v.copy(hot[i] || new THREE.Vector3(0, 0, 0)));
	haze.uniforms.uTime.value = t;
	// the light of the scene
	key.intensity = mix(0.18, 0.1, cam.b);
	sheen.intensity = 1.6 * (1 - 0.6 * seg(t, 1.5, 3)) * (1 - seg(t, 5, 8));
	top.intensity = 2.2 * smooth(seg(t, 7.5, 9.5));
	redGlow.intensity = 0.5 * smooth(seg(t, 6.5, 9.0)) * glow;
	grooveUniforms.uLP.value[8].copy(redGlow.position);
	grooveUniforms.uLC.value[8].set(1, 0.03, 0.05).multiplyScalar(redGlow.intensity * 0.3);
	// the words: they come out of the dark, a light sweeps across their metal, their edge turns red
	if (WORD.mat) {
		const wa = smooth(seg(t, 9.2, 10.0));
		WORD.mat.opacity = wa;
		WORD.mat.envMapIntensity = mix(0.2, 1.0, seg(t, 9.6, 10.8));
		const sx = mix(-12, 12, easeInOut(seg(t, 9.5, 11.0)));
		sweep.position.set(sx, FLOOR + 1.6, WORD_Z - 0.6);
		sweep.intensity = 1.1 * seg(t, 9.4, 9.7) * (1 - seg(t, 10.9, 11.2));
		WORD.edge.opacity = 0.7 * smooth(seg(t, 10.0, 11.0));
	}
	grooveUniforms.uLP.value[9].copy(sweep.position);
	grooveUniforms.uLC.value[9].set(1, 0.95, 0.9).multiplyScalar(sweep.intensity * 0.2);
	drawParticles();
	dustMat.opacity = 0.55 * (1 - seg(t, 5, 7.5));
	// depth of field: shallow while close, everything sharp from above
	bokeh.uniforms.focus.value = cam.dist;
	bokeh.uniforms.aperture.value = mix(0.0042, 0.0, smooth(seg(cam.b, 0.0, 0.6)));
	bokeh.uniforms.maxblur.value = 0.012;
	film.uniforms.uTime.value = t;
	film.uniforms.uFade.value = Math.max(1 - seg(t, 0, 0.6), seg(t, LEN - 0.7, LEN));
	composer.render();
}

window.LEN = LEN;
window.render = (t) => { render(t); return true; };
window.ready = wordReady.then(() => true);
</script>
