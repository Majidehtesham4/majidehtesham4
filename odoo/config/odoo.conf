[options]
; Odoo's own modules are always found; these are yours, then the OCA repositories (odoo.ps1 oca)
addons_path = /mnt/extra-addons,/mnt/oca/web,/mnt/oca/account-financial-reporting,/mnt/oca/account-financial-tools,/mnt/oca/account-reconcile,/mnt/oca/bank-statement-import,/mnt/oca/mis-builder,/mnt/oca/reporting-engine,/mnt/oca/server-ux,/mnt/oca/l10n-iran,/mnt/oca/account-budgeting,/mnt/oca/contract,/mnt/oca/dms,/mnt/oca/field-service,/mnt/oca/helpdesk,/mnt/oca/knowledge,/mnt/oca/manufacture,/mnt/oca/payroll,/mnt/oca/project,/mnt/oca/sign,/mnt/oca/spreadsheet,/mnt/oca/calendar,/mnt/oca/connector-telephony,/mnt/oca/timesheet
data_dir = /var/lib/odoo
; The master password of the database manager (create, back up, delete databases).
; Change it before putting anything real in.
admin_passwd = veron-trial-change-me
; The list of databases on the sign-in page; set False once one database is in real use
list_db = True
; The backups of older Odoo loaded by «odoo.ps1 import18» (name_odoo18) are only read by it: not listed to open
dbfilter = ^(?!.*_odoo18$).*$
