[options]
; Odoo's own modules are always found; these are yours, then the OCA repositories (odoo.ps1 oca)
addons_path = /mnt/extra-addons,/mnt/oca/web,/mnt/oca/account-financial-reporting,/mnt/oca/account-financial-tools,/mnt/oca/account-reconcile,/mnt/oca/bank-statement-import,/mnt/oca/mis-builder,/mnt/oca/reporting-engine,/mnt/oca/server-ux,/mnt/oca/l10n-iran
data_dir = /var/lib/odoo
; The master password of the database manager (create, back up, delete databases).
